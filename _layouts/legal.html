<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }} | Openly</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      {% assign current_path = page.url | default: '' %}
      <nav class="nav" aria-label="Legal policies">
        <a class="{% if current_path contains '/terms-of-service/' %}is-active{% endif %}" href="{{ '/legal/terms-of-service/' | relative_url }}">Terms</a>
        <a class="{% if current_path contains '/community-guidelines/' %}is-active{% endif %}" href="{{ '/legal/community-guidelines/' | relative_url }}">Guidelines</a>
        <a class="{% if current_path contains '/privacy-policy/' %}is-active{% endif %}" href="{{ '/legal/privacy-policy/' | relative_url }}">Privacy</a>
      </nav>
    </header>

    <main class="page">
      <article class="content">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <p>Last updated: April 25, 2026</p>
    </footer>
  </body>
</html>
