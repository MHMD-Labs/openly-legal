<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }} | Openly</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="{{ '/' | relative_url }}">Openly</a>
        <div class="nav-links">
          <a href="{{ '/legal/terms-of-service/' | relative_url }}">Terms</a>
          <a href="{{ '/legal/community-guidelines/' | relative_url }}">Guidelines</a>
          <a href="{{ '/legal/privacy-policy/' | relative_url }}">Privacy</a>
        </div>
      </nav>
    </header>

    <main class="page">
      <article class="content">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <p>Openly legal policies. Last updated pages should be reviewed before public launch.</p>
    </footer>
  </body>
</html>
